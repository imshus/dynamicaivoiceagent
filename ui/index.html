<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MRPscan Software — Talk to the Agent</title>
<style>
  :root {
    --bg: #0f1220; --accent: #f4c542; --text: #e8eaf2; --muted: #9aa0b4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", "Nirmala UI", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #20264a, var(--bg));
    color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 650; margin: 8px 0 2px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; text-align: center; }
  .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #mic {
    width: 108px; height: 108px; border-radius: 28px; border: none; cursor: pointer;
    background: linear-gradient(160deg, #34d17a, #16a34a); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 40px rgba(34,197,94,.3);
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
    position: relative;
  }
  #mic svg { width: 46px; height: 46px; display: block; }
  #mic:hover { transform: translateY(-2px); }
  #mic.live {
    background: linear-gradient(160deg, #ff6b6b, #e0453e);
    box-shadow: 0 0 0 0 rgba(255,107,107,.5); animation: pulse 1.6s infinite;
  }
  #mic:disabled { opacity: .6; cursor: default; animation: none; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,107,107,.45); }
    70%  { box-shadow: 0 0 0 24px rgba(255,107,107,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,107,107,0); }
  }
  #status { font-size: 14px; color: var(--muted); min-height: 20px; text-align: center; max-width: 420px; }
  #status.speaking { color: var(--accent); }
  #status.listening { color: #7ee0a1; }
  #status.error { color: #ff8a8a; }
</style>
</head>
<body>
  <h1>💎 MRPscan Software</h1>
  <div class="sub">Talk to the AI assistant using your microphone</div>

  <div class="mic-wrap">
    <button id="mic" aria-label="Start call"></button>
    <div id="status">Connecting…</div>
  </div>

<script>
"use strict";
// The look and the call flow of the MRPscan Software talk page (aivoiceagentweb
// ui/talk.html): one call button, a ringback tone until the agent picks up,
// and the call dialled as soon as the page is opened. The audio is this
// server's own: 16 kHz linear PCM up to Deepgram Flux, 24 kHz PCM back from
// ElevenLabs. The agent follows prompt.md, since this page sends no
// instructions of its own.
const IN_RATE = 16000;          // what we send to the server (Deepgram)
let OUT_RATE = 24000;           // what the server sends back (ElevenLabs); confirmed by "ready"

const micBtn = document.getElementById("mic");
const statusEl = document.getElementById("status");

let ws = null, audioCtx = null, micStream = null, processor = null, sourceNode = null, silentGain = null;
let running = false;
// True from the moment a call is being set up until it is live or has failed,
// so the auto-start and a stray click never dial twice.
let starting = false;
let nextPlayTime = 0, idleTimer = null;
const activeSources = new Set();
let inBuf = new Float32Array(0), readPos = 0;

// Call-button icons: green phone (idle, to call) and red hang-up (live, to end).
const ICON_CALL =
  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
  '<path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 ' +
  '1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 ' +
  '0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>';
const ICON_END =
  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
  '<path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 ' +
  '1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 ' +
  '0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 ' +
  '0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>';

// The deployed agent's socket (PRATHAM_AI_URL/ws), from /prompt. A call waits
// a moment for it, so a page hosted on another site dials the right server.
let SOCKET_URL = "";
const configReady = fetch("/prompt")
  .then((r) => r.json())
  .then((d) => { SOCKET_URL = d.socket_url || ""; })
  .catch(() => {});

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }

// ── Ringback ("calling…") tone: 440+480 Hz, 3.5 s on / 2.5 s off ─────────────
// It plays from the dial until the agent's first audio arrives (the pickup).
// The agent can answer almost at once, which made the greeting cut in before
// the call felt like a call, so the phone rings for at least MIN_RING_MS and
// any audio that arrives earlier is held until then.
const MIN_RING_MS = 1200;
let ringOscs = null, ringGain = null, ringTimer = null, ringing = false;
let ringStartMs = 0, pickupBuffer = [], pickupTimer = null;

function startRingback() {
  if (!audioCtx || ringing) return;
  ringing = true;
  ringStartMs = performance.now();
  ringGain = audioCtx.createGain();
  ringGain.gain.value = 0.0001;
  ringGain.connect(audioCtx.destination);
  ringOscs = [440, 480].map((f) => {
    const o = audioCtx.createOscillator();
    o.type = "sine";
    o.frequency.value = f;
    o.connect(ringGain);
    o.start();
    return o;
  });
  const ring = () => {
    if (!ringing || !audioCtx) return;
    // A backgrounded tab (common on mobile) suspends the context; nudge it back.
    if (audioCtx.state === "suspended") { try { audioCtx.resume(); } catch (e) {} }
    try {
      const t = audioCtx.currentTime;
      ringGain.gain.cancelScheduledValues(t);
      ringGain.gain.setValueAtTime(0.0001, t);
      ringGain.gain.exponentialRampToValueAtTime(0.12, t + 0.04);   // ring on
      ringGain.gain.setValueAtTime(0.12, t + 3.5);
      ringGain.gain.exponentialRampToValueAtTime(0.0001, t + 3.54); // ring off
    } catch (e) {}
    ringTimer = setTimeout(ring, 6000);
  };
  ring();
  setStatus("📞 Calling the agent…");
}

function stopRingback() {
  if (!ringing) return;
  ringing = false;
  if (ringTimer) { clearTimeout(ringTimer); ringTimer = null; }
  if (pickupTimer) { clearTimeout(pickupTimer); pickupTimer = null; }
  try {
    const t = audioCtx ? audioCtx.currentTime : 0;
    if (ringGain) { ringGain.gain.cancelScheduledValues(t); ringGain.gain.setValueAtTime(0.0001, t); }
  } catch (e) {}
  try { if (ringOscs) ringOscs.forEach((o) => { try { o.stop(); } catch (e) {} }); } catch (e) {}
  ringOscs = null; ringGain = null;
}

// The ring has played long enough: silence it and play the audio that came early.
function flushPickup() {
  pickupTimer = null;
  stopRingback();
  const chunks = pickupBuffer;
  pickupBuffer = [];
  for (const c of chunks) playPcm(c);
}

// ── Playback: 24 kHz PCM → the context's own rate, gapless ──────────────────
// Built at the context rate rather than handing the browser a 24 kHz buffer:
// mobile browsers (iOS Safari above all) glitch on mismatched rates.
function playPcm(int16) {
  if (!audioCtx || !int16.length) return;
  if (ringing) {
    const remaining = MIN_RING_MS - (performance.now() - ringStartMs);
    if (remaining > 0) {
      pickupBuffer.push(int16);
      if (!pickupTimer) pickupTimer = setTimeout(flushPickup, remaining);
      return;
    }
    stopRingback();              // rang long enough: pick up now
  }
  if (audioCtx.state === "suspended") { try { audioCtx.resume(); } catch (e) {} }
  const n = int16.length, outRate = audioCtx.sampleRate, ratio = outRate / OUT_RATE;
  const outLen = Math.max(1, Math.round(n * ratio));
  const f32 = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const p = i / ratio, i0 = Math.floor(p), fr = p - i0;
    const s0 = int16[i0] / 32768, s1 = int16[Math.min(i0 + 1, n - 1)] / 32768;
    f32[i] = s0 * (1 - fr) + s1 * fr;
  }
  const buf = audioCtx.createBuffer(1, outLen, outRate);
  buf.copyToChannel(f32, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (nextPlayTime < now) nextPlayTime = now + 0.05;
  src.start(nextPlayTime);
  nextPlayTime += buf.duration;
  activeSources.add(src);
  src.onended = () => activeSources.delete(src);
  setStatus("🔊 Agent speaking…", "speaking");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (running) setStatus("🎤 Listening…", "listening"); },
                         (nextPlayTime - audioCtx.currentTime) * 1000 + 60);
}

function clearPlayback() {
  for (const s of activeSources) { try { s.stop(); } catch (e) {} }
  activeSources.clear();
  nextPlayTime = 0;
  clearTimeout(idleTimer);
}

// ── Capture: mic → 16 kHz int16 ─────────────────────────────────────────────
function resampleTo16k(input, inRate) {
  const merged = new Float32Array(inBuf.length + input.length);
  merged.set(inBuf, 0); merged.set(input, inBuf.length);
  inBuf = merged;
  const ratio = inRate / IN_RATE, out = [];
  while (readPos + 1 < inBuf.length) {
    const i = Math.floor(readPos), fr = readPos - i;
    out.push(inBuf[i] * (1 - fr) + inBuf[i + 1] * fr);
    readPos += ratio;
  }
  const keep = Math.floor(readPos);
  inBuf = inBuf.slice(keep); readPos -= keep;
  return out;
}

// ── Talking over the agent ──────────────────────────────────────────────────
// The mic stays open the whole call, so a caller can cut in at any moment.
// Waiting for Deepgram to call it a turn costs a beat and, on a speakerphone,
// can be the agent hearing itself; the page knows first. While the agent is
// speaking, the floor learns whatever the speaker is putting into the mic, and
// a voice clearly above that floor stops the agent at once.
const DT_FRAMES = 3;        // consecutive loud frames before it counts (~100 ms)
const DT_MARGIN = 2.5;      // how far above the learnt echo floor a voice must be
const DT_ABSOLUTE = 0.02;   // and its own minimum level, so quiet rooms sit still
let echoFloor = 0, loudFrames = 0;

function agentSpeaking() {
  return Boolean(audioCtx) && nextPlayTime > audioCtx.currentTime + 0.02;
}

function noteMicLevel(frame) {
  if (!agentSpeaking()) { echoFloor = 0; loudFrames = 0; return; }
  let sum = 0, n = 0;
  for (let i = 0; i < frame.length; i += 4) { sum += frame[i] * frame[i]; n++; }
  const rms = Math.sqrt(sum / Math.max(1, n));
  echoFloor = echoFloor ? echoFloor * 0.85 + rms * 0.15 : rms;
  if (rms > DT_ABSOLUTE && rms > echoFloor * DT_MARGIN) {
    if (++loudFrames >= DT_FRAMES) { loudFrames = 0; interruptAgent(); }
  } else {
    loudFrames = 0;
  }
}

function interruptAgent() {
  if (!running || !ws || ws.readyState !== WebSocket.OPEN) return;
  clearPlayback();          // the agent stops mid-word, and its echo with it
  echoFloor = 0;
  setStatus("🎤 Listening…", "listening");
  try { ws.send(JSON.stringify({ type: "interrupt", reason: "talked over" })); } catch (e) {}
}

function onAudio(e) {
  if (!running || !ws || ws.readyState !== WebSocket.OPEN) return;
  const input = e.inputBuffer.getChannelData(0);
  noteMicLevel(input);
  const down = resampleTo16k(input, audioCtx.sampleRate);
  if (!down.length) return;
  const pcm = new Int16Array(down.length);
  for (let i = 0; i < down.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, Math.round(down[i] * 32767)));
  ws.send(pcm.buffer);
}

// ── Call lifecycle ──────────────────────────────────────────────────────────
function wsUrl() {
  // Deployed: talk to the agent at PRATHAM_AI_URL. Local runs keep their own socket.
  const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (SOCKET_URL && !local) return SOCKET_URL;
  if (location.protocol === "file:" || !location.host) return null;
  return (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws";
}

// `auto` marks the call the page starts by itself on load. It changes nothing
// about the call, only what is said when the browser refuses: on an auto-start
// there is no click to blame, so the shop needs telling what to do.
async function start(auto) {
  if (starting || running) return;
  try {
    await startCall(auto);
  } catch (err) {
    // Never leave the page sitting on "Connecting…" with a dead button.
    console.error(err);
    starting = false;
    teardown();
    setStatus("Couldn't start the call (" + ((err && err.message) || err) + "). Click the button to try again.", "error");
  }
}

async function startCall(auto) {
  starting = true;
  await Promise.race([configReady, new Promise((r) => setTimeout(r, 1500))]);
  const url = wsUrl();
  if (!url) {
    starting = false;
    setStatus("Open http://localhost:8100 (run: python server.py), not the .html file itself.", "error");
    return;
  }
  // Browsers give a page the microphone only on https:// (or localhost). On a
  // plain http://<server-ip> address navigator.mediaDevices does not exist.
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    starting = false;
    setStatus("The microphone only works on an https:// address (or localhost). This page is " + location.origin + ".", "error");
    return;
  }

  micBtn.disabled = true;
  if (auto) setStatus("Connecting…");

  // The audio context and the ring start at once, before the mic is even
  // asked for, so the click gets instant feedback.
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // On a site the browser does not yet trust to play sound (a new address,
  // opened without a tap), resume() can stay pending forever. Give it a moment
  // and judge by the state instead of hanging on "Connecting…".
  if (audioCtx.state === "suspended") {
    try { await Promise.race([audioCtx.resume(), new Promise((r) => setTimeout(r, 500))]); } catch (e) {}
  }
  // Autoplay policy: a context made without a gesture stays suspended on most
  // browsers and every browser on iOS. The agent would talk into a muted
  // output, so wait for any tap; the retry runs inside a real gesture.
  if (audioCtx.state !== "running") {
    starting = false;
    teardown();
    armGesture();
    return;
  }
  // iOS Safari only truly unlocks output once a real buffer has played inside
  // the gesture; without this the ring and the greeting can be swallowed.
  try {
    const u = audioCtx.createBufferSource();
    u.buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
    u.connect(audioCtx.destination); u.start(0);
  } catch (e) {}
  inBuf = new Float32Array(0); readPos = 0; nextPlayTime = 0;
  pickupBuffer = [];
  startRingback();

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
    });
  } catch (err) {
    starting = false;
    teardown();
    setStatus(auto
      ? "Microphone blocked. Allow the mic (lock icon in the address bar), then reload."
      : "Microphone blocked. Allow the mic (lock icon in the address bar), then click again.", "error");
    return;
  }

  let opened = false;
  ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    opened = true; starting = false; running = true;
    ws.send(JSON.stringify({ type: "start" }));
    // Capture graph: mic → script processor, routed to a muted gain so
    // onaudioprocess fires without playing the mic back to the speaker.
    sourceNode = audioCtx.createMediaStreamSource(micStream);
    processor = audioCtx.createScriptProcessor(2048, 1, 1);
    silentGain = audioCtx.createGain(); silentGain.gain.value = 0;
    processor.onaudioprocess = onAudio;
    sourceNode.connect(processor); processor.connect(silentGain); silentGain.connect(audioCtx.destination);
    micBtn.disabled = false;
    micBtn.classList.add("live");
    micBtn.innerHTML = ICON_END;
    micBtn.setAttribute("aria-label", "End call");
    // Keep "Calling…" until the agent actually picks up (its first audio).
    if (!ringing) setStatus("🎤 Listening…", "listening");
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "ready") OUT_RATE = m.sample_rate || OUT_RATE;
      else if (m.type === "clear") { clearPlayback(); setStatus("🎤 Listening…", "listening"); }
      else if (m.type === "error") setStatus(m.text, "error");
      else if (m.type === "hangup") { stop(); setStatus("Call ended."); }
      return;
    }
    let data = ev.data;
    if (data.byteLength % 2) data = data.slice(0, data.byteLength - 1);
    playPcm(new Int16Array(data));
  };
  ws.onerror = () => {
    if (!opened) setStatus("Can't reach the agent at " + url + " — is the server running?", "error");
  };
  ws.onclose = (ev) => {
    starting = false;
    if (!opened) {
      teardown();
      setStatus("Connection failed to " + url + (ev && ev.code ? " (code " + ev.code + ")" : "") +
        ". Is the server running, and does the proxy in front of it pass WebSockets?", "error");
      return;
    }
    if (running) stop();
  };
}

// Release audio, mic and socket WITHOUT touching the status line, so a
// diagnostic message set by the caller survives.
function teardown() {
  running = false;
  stopRingback();
  clearPlayback();
  try { if (processor) processor.onaudioprocess = null; } catch (e) {}
  for (const n of [sourceNode, processor, silentGain]) { try { n && n.disconnect(); } catch (e) {} }
  try { micStream && micStream.getTracks().forEach((t) => t.stop()); } catch (e) {}
  try { audioCtx && audioCtx.close(); } catch (e) {}
  ws = null; audioCtx = null; micStream = null; processor = null; sourceNode = null; silentGain = null;
  micBtn.classList.remove("live");
  micBtn.innerHTML = ICON_CALL;
  micBtn.setAttribute("aria-label", "Start call");
  micBtn.disabled = false;
}

function stop() {
  try { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "stop" })); } catch (e) {}
  try { ws && ws.close(); } catch (e) {}
  teardown();
  setStatus("Stopped. Click the mic to talk again.");
}

micBtn.innerHTML = ICON_CALL;   // start in the green "call" state
micBtn.addEventListener("click", () => { running ? stop() : start(false); });

// ── Auto-start ──────────────────────────────────────────────────────────────
// Opening the page IS the call: it dials as soon as it loads. Two things can
// stop that, and both are handled rather than left as silence: the browser's
// autoplay policy (no gesture yet, so output is muted) and a microphone that
// has not been allowed. The button stays, for hanging up and calling again.
function armGesture() {
  setStatus("Tap anywhere to start the call");
  const go = () => {
    document.removeEventListener("pointerdown", go);
    document.removeEventListener("keydown", go);
    document.removeEventListener("touchend", go);
    start(false);
  };
  document.addEventListener("pointerdown", go);
  document.addEventListener("keydown", go);
  document.addEventListener("touchend", go);
}

// A tab opened in the background gets no audio and often no mic; dial when it
// is actually looked at instead of failing before anyone sees it.
function autoStart() {
  if (document.visibilityState === "hidden") {
    document.addEventListener("visibilitychange", function once() {
      if (document.visibilityState !== "hidden") {
        document.removeEventListener("visibilitychange", once);
        start(true);
      }
    });
    return;
  }
  start(true);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", autoStart);
else autoStart();
</script>
</body>
</html>
